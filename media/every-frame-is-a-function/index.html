<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Every Frame Is a Function</title>
<style>
@font-face { font-family: "Source Serif 4"; font-weight: 900; src: url(fonts/source-serif-4-latin-900-normal.woff2) format("woff2"); }
@font-face { font-family: "Source Serif 4"; font-weight: 700; src: url(fonts/source-serif-4-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 600; src: url(fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 700; src: url(fonts/ibm-plex-mono-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 800; src: url(fonts/inter-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 900; src: url(fonts/inter-latin-900-normal.woff2) format("woff2"); }
html, body { margin: 0; background: #F2EDE2; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="build/timeline.js"></script>
<script src="score.js"></script>
<script src="draw.js"></script>
<script>
window.ready = (async () => {
  const faces = ['900 40px "Source Serif 4"', '700 40px "Source Serif 4"', '400 40px "IBM Plex Mono"', '500 40px "IBM Plex Mono"',
    '600 40px "IBM Plex Mono"', '700 40px "IBM Plex Mono"', '800 40px "Inter"', '900 40px "Inter"'];
  await Promise.all(faces.map((f) => document.fonts.load(f)));
  await document.fonts.ready;
  return true;
})();
</script>
</body>
</html>
